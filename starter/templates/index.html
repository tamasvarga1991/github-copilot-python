<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <label class="theme-switch">
    <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark mode">
    <span class="theme-switch-track" aria-hidden="true"></span>
    <span id="theme-label">Light Mode</span>
  </label>
  <p id="theme-message" role="status" aria-live="polite" hidden></p>
  <p class="game-timer">Time: <span id="timer" role="timer" aria-label="Elapsed time" data-elapsed-seconds="0">00:00</span></p>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty" name="difficulty" aria-describedby="difficulty-message">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <span id="message" role="status" aria-live="polite"></span>
  </div>
  <p id="difficulty-message" role="status" aria-live="polite">Difficulty changes apply when you click New Game.</p>
  <div id="score-entry" class="score-entry" hidden>
    <label for="player-name">Your name for the leaderboard:</label>
    <input id="player-name" name="player-name" type="text" maxlength="30" autocomplete="name">
    <button id="save-score" type="button">Save Score</button>
  </div>
  <section class="leaderboard-section" aria-labelledby="leaderboard-heading">
    <h2 id="leaderboard-heading">Top 10 Scores</h2>
    <table id="leaderboard">
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Player</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
